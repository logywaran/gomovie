<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed | GoMovie</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
            Roboto, Helvetica, Arial, sans-serif;
            background: #f7f8fa;
            color: #202124;
        }

        .card {
            width: 100%;
            max-width: 460px;
            padding: 52px 42px 44px;
            text-align: center;
            background: #ffffff;
            border: 1px solid #e9eaed;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            animation: cardEntry 0.6s ease-out;
        }

        .brand {
            margin-bottom: 42px;
            font-size: 25px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #202124;
        }

        .brand span {
            color: #e63946;
        }

        .icon-wrapper {
            width: 88px;
            height: 88px;
            margin: 0 auto 28px;
            border-radius: 50%;
            background: #fff1f1;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: iconEntry 0.6s 0.15s both;
        }

        .cross {
            position: relative;
            width: 32px;
            height: 32px;
        }

        .cross::before,
        .cross::after {
            content: "";
            position: absolute;
            top: 14px;
            left: 0;
            width: 32px;
            height: 4px;
            border-radius: 4px;
            background: #dc4c55;
        }

        .cross::before {
            transform: rotate(45deg) scaleX(0);
            animation: drawCross 0.35s 0.65s ease-out forwards;
        }

        .cross::after {
            transform: rotate(-45deg) scaleX(0);
            animation: drawCross 0.35s 0.8s ease-out forwards;
        }

        h1 {
            margin-bottom: 12px;
            font-size: 29px;
            font-weight: 650;
            letter-spacing: -0.6px;
            color: #202124;
            animation: fadeUp 0.5s 0.35s both;
        }

        .message {
            max-width: 340px;
            margin: 0 auto 28px;
            color: #70757d;
            font-size: 15px;
            line-height: 1.65;
            animation: fadeUp 0.5s 0.45s both;
        }

        .notice {
            margin-bottom: 30px;
            padding: 15px 18px;
            border: 1px solid #f1e2e2;
            border-radius: 12px;
            background: #fffafa;
            color: #76585a;
            font-size: 14px;
            line-height: 1.5;
            animation: fadeUp 0.5s 0.55s both;
        }

        .button {
            display: inline-block;
            padding: 13px 25px;
            border-radius: 10px;
            background: #202124;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s ease,
            box-shadow 0.2s ease;
            animation: fadeUp 0.5s 0.65s both;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(0, 0, 0, 0.12);
        }

        .footer {
            margin-top: 24px;
            color: #9a9da3;
            font-size: 12px;
            animation: fadeUp 0.5s 0.75s both;
        }

        @keyframes cardEntry {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes iconEntry {
            from {
                opacity: 0;
                transform: scale(0.75);
            }

            70% {
                transform: scale(1.05);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes drawCross {
            to {
                transform: rotate(45deg) scaleX(1);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 42px 25px 36px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="card">

    <div class="brand">
        Go<span>Movie</span>
    </div>

    <div class="icon-wrapper">
        <div class="cross"></div>
    </div>

    <h1>Payment Failed</h1>

    <p class="message">
        We couldn't complete your payment.
        Your booking has not been confirmed.
    </p>

    <div class="notice">
        Please try again or choose another payment method.
    </div>

    <a href="/" class="button">
        Try Again
    </a>

    <div class="footer">
        Need help? Please contact GoMovie support.
    </div>

</div>

</body>
</html>
